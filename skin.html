<!--
  LINE 10 — a transit-wayfinding skin for Video.js v10 (video preset).

  Forked from the Scaffold skin source (@videojs/video, registry "scaffold").
  Same composition rules: <media-container> is the skin root, the media
  element sits inside it next to the controls, and every control is a
  Video.js UI component that owns its own state, ARIA and keyboard support.

  The container supplies role="group", tabindex="0" and a default aria-label;
  the aria-label below overrides the default with a clearer one.
-->
<media-container class="line10" data-theme="line10" data-preset="video" aria-label="Video player">
  <!-- Add a compatible media component here. -->

  <media-poster class="l10-poster">
    <img alt="" decoding="async" class="l10-poster-image">
  </media-poster>

  <!-- "Service disruption" notice -->
  <media-error-dialog>
    <media-dialog-backdrop class="l10-dialog-backdrop"></media-dialog-backdrop>
    <media-dialog-popup class="l10-dialog">
      <media-dialog-title class="l10-dialog-title"></media-dialog-title>
      <media-dialog-description class="l10-dialog-description"></media-dialog-description>
      <media-dialog-close class="l10-dialog-close"></media-dialog-close>
    </media-dialog-popup>
  </media-error-dialog>

  <media-controls>
    <!-- "Train approaching": three stops lighting in sequence -->
    <media-buffering-indicator class="l10-buffering">
      <span class="l10-buffering-sign" aria-hidden="true"><i></i><i></i><i></i></span>
    </media-buffering-indicator>

    <media-controls-content class="l10-controls">
      <media-tooltip-group>

        <!-- Line bullet + destination (content title) -->
        <media-controls-group class="l10-header">
          <span class="l10-bullet" aria-hidden="true">10</span>
          <media-title class="l10-title"></media-title>
        </media-controls-group>

        <!-- The platform sign -->
        <div class="l10-sign">

          <!-- Line strip: the seek bar drawn as a route with ten stops -->
          <media-time-slider class="l10-time-slider">
            <media-slider-track class="l10-track">
              <media-slider-buffer class="l10-buffer"></media-slider-buffer>
              <media-slider-fill class="l10-fill"></media-slider-fill>
            </media-slider-track>
            <media-slider-thumb class="l10-thumb"></media-slider-thumb>
            <media-slider-preview class="l10-preview">
              <media-slider-thumbnail class="l10-thumbnail"></media-slider-thumbnail>
              <span class="l10-preview-label">
                <svg class="l10-preview-pin" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <circle cx="12" cy="12" r="7" />
                  <circle class="l10-solid" cx="12" cy="12" r="2.5" />
                </svg>
                <media-slider-value class="l10-preview-time" type="pointer"></media-slider-value>
              </span>
            </media-slider-preview>
          </media-time-slider>

          <div class="l10-bar">
            <media-controls-group class="l10-group" aria-label="Playback">
              <media-play-button class="l10-button l10-play" id="l10-play">
                <svg class="l10-icon l10-icon-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path class="l10-solid" d="M8.5 5.6v12.8a.9.9 0 0 0 1.37.77l10.3-6.4a.9.9 0 0 0 0-1.54l-10.3-6.4a.9.9 0 0 0-1.37.77Z" />
                </svg>
                <svg class="l10-icon l10-icon-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <rect class="l10-solid" x="6" y="5" width="4.5" height="14" rx="1.2" />
                  <rect class="l10-solid" x="13.5" y="5" width="4.5" height="14" rx="1.2" />
                </svg>
                <svg class="l10-icon l10-icon-replay" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M5 12a7 7 0 1 0 2.2-5.1" />
                  <path d="M4.5 4v4h4" />
                  <circle class="l10-solid" cx="12" cy="12" r="2" />
                </svg>
              </media-play-button>
              <media-tooltip trigger="l10-play" side="top" class="l10-popup l10-tooltip">
                <media-tooltip-label></media-tooltip-label>
                <media-tooltip-shortcut class="l10-kbd"></media-tooltip-shortcut>
              </media-tooltip>

              <media-time-group class="l10-time">
                <media-time class="l10-time-current" type="current"></media-time>
                <media-time-separator class="l10-time-separator"></media-time-separator>
                <media-time class="l10-time-duration" type="duration"></media-time>
              </media-time-group>
            </media-controls-group>

            <media-controls-group class="l10-group" aria-label="Player controls">
              <media-mute-button commandfor="l10-volume" class="l10-button l10-mute" id="l10-mute">
                <svg class="l10-icon l10-icon-volume-high" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path class="l10-solid" d="M4 9.5h3.2l4.3-3.6a.6.6 0 0 1 1 .46v11.28a.6.6 0 0 1-1 .46L7.2 14.5H4a.5.5 0 0 1-.5-.5v-4a.5.5 0 0 1 .5-.5Z" />
                  <path d="M16 9a4.2 4.2 0 0 1 0 6" />
                  <path d="M18.6 6.2a8.2 8.2 0 0 1 0 11.6" />
                </svg>
                <svg class="l10-icon l10-icon-volume-low" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path class="l10-solid" d="M4 9.5h3.2l4.3-3.6a.6.6 0 0 1 1 .46v11.28a.6.6 0 0 1-1 .46L7.2 14.5H4a.5.5 0 0 1-.5-.5v-4a.5.5 0 0 1 .5-.5Z" />
                  <path d="M16 9a4.2 4.2 0 0 1 0 6" />
                </svg>
                <svg class="l10-icon l10-icon-volume-off" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path class="l10-solid" d="M4 9.5h3.2l4.3-3.6a.6.6 0 0 1 1 .46v11.28a.6.6 0 0 1-1 .46L7.2 14.5H4a.5.5 0 0 1-.5-.5v-4a.5.5 0 0 1 .5-.5Z" />
                  <path d="m16 9.5 5 5" />
                  <path d="m21 9.5-5 5" />
                </svg>
              </media-mute-button>
              <media-volume-popover open-on-hover delay="150" close-delay="150" side="top" class="l10-popup l10-volume" id="l10-volume">
                <media-volume-slider class="l10-volume-slider" orientation="vertical">
                  <media-slider-track class="l10-volume-track">
                    <media-slider-fill class="l10-volume-fill"></media-slider-fill>
                  </media-slider-track>
                  <media-slider-thumb class="l10-thumb l10-volume-thumb"></media-slider-thumb>
                </media-volume-slider>
              </media-volume-popover>

              <!-- Bonus: the keyboard timetable (also toggled with the ? key) -->
              <button type="button" commandfor="l10-timetable" class="l10-button l10-help" id="l10-help" aria-label="Keyboard shortcuts" aria-keyshortcuts="?">
                <svg class="l10-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M7 4.5v15" />
                  <circle class="l10-solid" cx="7" cy="6.5" r="2.4" />
                  <circle class="l10-solid" cx="7" cy="12" r="2.4" />
                  <circle class="l10-solid" cx="7" cy="17.5" r="2.4" />
                  <path d="M12.5 6.5H20" />
                  <path d="M12.5 12H20" />
                  <path d="M12.5 17.5H17" />
                </svg>
              </button>
              <media-tooltip trigger="l10-help" side="top" class="l10-popup l10-tooltip">
                <span>Keyboard shortcuts</span>
                <kbd class="l10-kbd">?</kbd>
              </media-tooltip>
              <media-popover id="l10-timetable" side="top" align="end" class="l10-popup l10-timetable" aria-label="Keyboard timetable">
                <p class="l10-timetable-title">
                  <span class="l10-bullet" aria-hidden="true">10</span>
                  Keyboard timetable
                </p>
                <dl class="l10-route">
                  <div class="l10-stop">
                    <dt><kbd class="l10-kbd">Space</kbd><span class="l10-sr-only">or</span><kbd class="l10-kbd">K</kbd></dt>
                    <dd>Play or pause</dd>
                  </div>
                  <div class="l10-stop">
                    <dt><kbd class="l10-kbd"><span aria-hidden="true">←</span><span class="l10-sr-only">Left arrow</span></kbd><kbd class="l10-kbd"><span aria-hidden="true">→</span><span class="l10-sr-only">Right arrow</span></kbd></dt>
                    <dd>Back or forward 10 seconds</dd>
                  </div>
                  <div class="l10-stop">
                    <dt><kbd class="l10-kbd">0</kbd><span aria-hidden="true">–</span><span class="l10-sr-only">to</span><kbd class="l10-kbd">9</kbd></dt>
                    <dd>Jump to a stop on the line</dd>
                  </div>
                  <div class="l10-stop">
                    <dt><kbd class="l10-kbd"><span aria-hidden="true">↑</span><span class="l10-sr-only">Up arrow</span></kbd><kbd class="l10-kbd"><span aria-hidden="true">↓</span><span class="l10-sr-only">Down arrow</span></kbd></dt>
                    <dd>Volume up or down</dd>
                  </div>
                  <div class="l10-stop">
                    <dt><kbd class="l10-kbd">M</kbd></dt>
                    <dd>Mute or unmute</dd>
                  </div>
                  <div class="l10-stop">
                    <dt><kbd class="l10-kbd">F</kbd></dt>
                    <dd>Fullscreen</dd>
                  </div>
                  <div class="l10-stop">
                    <dt><kbd class="l10-kbd">&lt;</kbd><kbd class="l10-kbd">&gt;</kbd></dt>
                    <dd>Slower or faster</dd>
                  </div>
                  <div class="l10-stop">
                    <dt><kbd class="l10-kbd">?</kbd></dt>
                    <dd>Show or hide this timetable</dd>
                  </div>
                </dl>
              </media-popover>

              <media-fullscreen-button class="l10-button l10-fullscreen" id="l10-fullscreen">
                <svg class="l10-icon l10-icon-fullscreen-enter" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M13.5 10.5 19.5 4.5" />
                  <path d="M14.5 4.5h5v5" />
                  <path d="M10.5 13.5 4.5 19.5" />
                  <path d="M9.5 19.5h-5v-5" />
                </svg>
                <svg class="l10-icon l10-icon-fullscreen-exit" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M19.5 4.5 13.5 10.5" />
                  <path d="M18.5 10.5h-5v-5" />
                  <path d="M4.5 19.5 10.5 13.5" />
                  <path d="M5.5 13.5h5v5" />
                </svg>
              </media-fullscreen-button>
              <media-tooltip trigger="l10-fullscreen" side="top" align="end" class="l10-popup l10-tooltip">
                <media-tooltip-label></media-tooltip-label>
                <media-tooltip-shortcut class="l10-kbd"></media-tooltip-shortcut>
              </media-tooltip>
            </media-controls-group>
          </div>
        </div>

      </media-tooltip-group>
    </media-controls-content>
  </media-controls>

  <!-- Keyboard shortcuts (active while focus is inside the player) -->
  <media-hotkey keys="Space" action="togglePaused"></media-hotkey>
  <media-hotkey keys="k" action="togglePaused"></media-hotkey>
  <media-hotkey keys="m" action="toggleMuted"></media-hotkey>
  <media-hotkey keys="ArrowRight" action="seekStep"></media-hotkey>
  <media-hotkey keys="ArrowLeft" action="seekStep"></media-hotkey>
  <media-hotkey keys="l" action="seekStep"></media-hotkey>
  <media-hotkey keys="j" action="seekStep"></media-hotkey>
  <media-hotkey keys="ArrowUp" action="volumeStep"></media-hotkey>
  <media-hotkey keys="ArrowDown" action="volumeStep"></media-hotkey>
  <media-hotkey keys="0-9" action="seekToPercent"></media-hotkey>
  <media-hotkey keys="Home" action="seekToPercent" value="0"></media-hotkey>
  <media-hotkey keys="End" action="seekToPercent" value="100"></media-hotkey>
  <media-hotkey keys=">" action="speedUp"></media-hotkey>
  <media-hotkey keys="<" action="speedDown"></media-hotkey>
  <media-hotkey keys="f" action="toggleFullscreen"></media-hotkey>

  <!-- Pointer and touch gestures -->
  <media-gesture type="tap" action="togglePaused" pointer="mouse" region="center"></media-gesture>
  <media-gesture type="tap" action="toggleControls" pointer="touch"></media-gesture>
  <media-gesture type="doubletap" action="seekStep" region="left"></media-gesture>
  <media-gesture type="doubletap" action="toggleFullscreen" region="center"></media-gesture>
  <media-gesture type="doubletap" action="seekStep" region="right"></media-gesture>

  <!-- Visually hidden live region (role="status") for screen readers -->
  <media-status-announcer class="l10-sr-only"></media-status-announcer>

  <!-- On-screen feedback for keyboard and gesture actions -->
  <div class="l10-indicators" aria-hidden="true">
    <media-volume-indicator class="l10-indicator">
      <media-volume-indicator-fill class="l10-indicator-fill">
        <svg class="l10-icon" viewBox="0 0 24 24" focusable="false">
          <path class="l10-solid" d="M4 9.5h3.2l4.3-3.6a.6.6 0 0 1 1 .46v11.28a.6.6 0 0 1-1 .46L7.2 14.5H4a.5.5 0 0 1-.5-.5v-4a.5.5 0 0 1 .5-.5Z" />
          <path d="M16 9a4.2 4.2 0 0 1 0 6" />
        </svg>
        <media-volume-indicator-value></media-volume-indicator-value>
      </media-volume-indicator-fill>
    </media-volume-indicator>
    <media-seek-indicator class="l10-indicator l10-seek-indicator">
      <svg class="l10-icon" viewBox="0 0 24 24" focusable="false">
        <path d="m6 6.5 5.5 5.5L6 17.5" />
        <path d="m12.5 6.5 5.5 5.5-5.5 5.5" />
      </svg>
      <media-seek-indicator-value></media-seek-indicator-value>
    </media-seek-indicator>
    <!-- Playback speed: skin.js shows this on every speed change and keeps
         it up while a press-and-hold is playing at 2× -->
    <div class="l10-indicator l10-speed-indicator">
      <svg class="l10-icon" viewBox="0 0 24 24" focusable="false">
        <path d="M4.5 16.5a7.5 7.5 0 0 1 15 0" />
        <path d="m12 16.5 3.6-5" />
        <circle class="l10-solid" cx="12" cy="16.5" r="1.7" />
      </svg>
      <span class="l10-speed-value"></span>
    </div>
  </div>
</media-container>
